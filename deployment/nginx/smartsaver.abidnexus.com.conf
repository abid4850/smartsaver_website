# NGINX config for SmartSaver
# Domain: smartsaver.abidnexus.com
# Upstream app: Django served on 127.0.0.1:8000

upstream smartsaver_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name smartsaver.abidnexus.com;

    # Required for Let's Encrypt HTTP challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartsaver.abidnexus.com;

    # TLS certs managed by certbot.
    ssl_certificate /etc/letsencrypt/live/smartsaver.abidnexus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartsaver.abidnexus.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/smartsaver.abidnexus.com/chain.pem;

    # Modern TLS baseline.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP tuned for Django templates + Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 20m;
    keepalive_timeout 65;

    # Static and media files.
    location /static/ {
        alias /var/www/smartsaver/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /var/www/smartsaver/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120;
        proxy_connect_timeout 30;
        proxy_send_timeout 120;
        proxy_pass http://smartsaver_upstream;
    }

    # Optional gzip for text assets.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;
}
